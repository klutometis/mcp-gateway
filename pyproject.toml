[project]
name = "mcp-gateway"
version = "0.1.0"
description = "Generic MCP gateway: config-driven aggregation of multiple MCP servers (subset/rename, multi-instance routing, middleware, pluggable auth)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # 4.x. The 2026-09-06 break was one module: `fastmcp.tools.tool` became
    # `fastmcp.tools`, and three imports here used the old path. The public
    # `fastmcp.tools` path works on 3.4.4 too, so the floor stays where it is
    # and there is no ceiling to outgrow.
    "fastmcp>=3.4.4",
    # Imported directly (gateway.py: authlib for the OAuth proxy, which needs
    # httpx). Both rode in transitively under fastmcp 3.x and vanished on 4.x,
    # so they were never really optional — just undeclared.
    "authlib>=1.3",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "pillow>=12.2.0",
    "py-key-value-aio[disk]>=0.4.4",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.40.0",
]

[project.scripts]
gateway-local = "mcp_gateway.local:main"
gateway-remote = "mcp_gateway.remote:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]

[tool.uv]
dev-dependencies = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["tests/manual"]
